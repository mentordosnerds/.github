name: Cleanup Cloudflare Pages deployments

on:
  workflow_call:
    inputs:
      account-id:
        required: true
        type: string
      project-name:
        required: true
        type: string
      production-keep:
        default: 2
        required: false
        type: number
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Remove stale previews and retain production deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ inputs.project-name }}
          PRODUCTION_KEEP: ${{ inputs.production-keep }}
        shell: bash
        run: |
          set -euo pipefail

          wrangler() {
            npx --yes wrangler@4.127.1 "$@"
          }
          remote_heads="$(git ls-remote --heads origin \
            | jq -Rn '[inputs | capture("^(?<sha>[0-9a-f]+)\\trefs/heads/(?<branch>.+)$")]
              | reduce .[] as $head ({}; .[$head.branch] = $head.sha)')"
          deployments="$(wrangler pages deployment list --project-name "$PAGES_PROJECT" --json)"

          preview_selection="$(jq -c --argjson heads "$remote_heads" '
            reduce (
              .[]
              | select(((.Environment // .environment) | ascii_downcase) == "preview")
              | {
                  id: (.Id // .id),
                  branch: (.Branch // .branch // ""),
                  source: (.Source // .source // "")
                }
            ) as $deployment (
              { current_by_branch: {}, source_less: [], orphan: [], stale: [], duplicate: [], candidates: [] };
              if ($deployment.branch | length) == 0
                or ($deployment.source | length) == 0 then
                .source_less += [$deployment.id]
                | .candidates += [$deployment + {
                    reason: "source-less",
                    snapshot_head: ($heads[$deployment.branch] // "")
                  }]
              elif ($heads[$deployment.branch] // null) == null then
                .orphan += [$deployment.id]
                | .candidates += [$deployment + {
                    reason: "orphan",
                    snapshot_head: ""
                  }]
              elif ($heads[$deployment.branch] | startswith($deployment.source)) then
                # The Pages API returns newest first. Keep only the first deployment
                # for the current SHA of each live branch.
                if .current_by_branch[$deployment.branch] then
                  .duplicate += [$deployment.id]
                  | .candidates += [$deployment + {
                      reason: "duplicate",
                      snapshot_head: $heads[$deployment.branch]
                    }]
                else
                  .current_by_branch[$deployment.branch] = $deployment.id
                end
              else
                .stale += [$deployment.id]
                | .candidates += [$deployment + {
                    reason: "stale",
                    snapshot_head: $heads[$deployment.branch]
                  }]
              end
            )
            | . + { ids: (.source_less + .orphan + .stale + .duplicate) }
          ' <<<"$deployments")"
          mapfile -t preview_candidates < <(jq -c '.candidates[]?' <<<"$preview_selection")

          production_ids="$(jq -r --argjson keep "$PRODUCTION_KEEP" '
            [ .[]
              | select(((.Environment // .environment) | ascii_downcase) == "production")
            ]
            # The Pages API returns deployments newest first; Wrangler preserves that order.
            | .[$keep:][]
            | (.Id // .id)
          ' <<<"$deployments" | sort -u)"

          preview_count="$(jq '.ids | length' <<<"$preview_selection")"
          production_count="$(wc -w <<<"$production_ids" | tr -d ' ')"
          echo "Remote branches: $(jq 'length' <<<"$remote_heads")"
          echo "Pages deployments returned: $(jq 'length' <<<"$deployments")"
          echo "Selected $(jq '.source_less | length' <<<"$preview_selection") source-less previews, $(jq '.orphan | length' <<<"$preview_selection") orphan previews, $(jq '.stale | length' <<<"$preview_selection") stale-SHA previews, and $(jq '.duplicate | length' <<<"$preview_selection") duplicate current-SHA previews."
          echo "Selected $preview_count stale previews and $production_count old production deployments."

          failed=0
          skipped=0
          for candidate in "${preview_candidates[@]}"; do
            deployment_id="$(jq -r '.id' <<<"$candidate")"
            branch="$(jq -r '.branch' <<<"$candidate")"
            reason="$(jq -r '.reason' <<<"$candidate")"
            snapshot_head="$(jq -r '.snapshot_head' <<<"$candidate")"

            # A branch can advance after the initial snapshot. Re-read its head
            # immediately before deletion so a fresh Pages deployment is never
            # removed using an obsolete SHA.
            if [[ -n "$branch" ]]; then
              current_head="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 { print $1 }')"
              if [[ "$reason" == "orphan" && -n "$current_head" ]] \
                || [[ "$reason" != "orphan" && "$reason" != "source-less" && "$current_head" != "$snapshot_head" ]]; then
                echo "::warning::Skipping Pages deployment $deployment_id because branch $branch changed during cleanup"
                skipped=$((skipped + 1))
                continue
              fi
            fi

            echo "Deleting Pages deployment $deployment_id"
            if ! wrangler pages deployment delete "$deployment_id" --project-name "$PAGES_PROJECT" --force; then
              echo "::error::Cloudflare refused to delete deployment $deployment_id"
              failed=1
            fi
          done

          for deployment_id in $production_ids; do
            echo "Deleting Pages deployment $deployment_id"
            if ! wrangler pages deployment delete "$deployment_id" --project-name "$PAGES_PROJECT" --force; then
              echo "::error::Cloudflare refused to delete deployment $deployment_id"
              failed=1
            fi
          done

          echo "Skipped $skipped previews whose branch changed during cleanup."

          exit "$failed"
